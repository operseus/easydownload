name: Build C++ and Lazarus

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Lazarus & FPC
      run: |
        sudo apt-get update
        sudo apt-get install -y fpc lazarus

    - name: Build C++
      run: |
        g++ *.cpp -o cpp_prog 

    - name: Build Lazarus
      run: |
        lazbuild EasyDownload.lpi
